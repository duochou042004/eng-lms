# Local development database (T-M1.4, ADR-0012). Rootless Podman: ./scripts/dev-up.sh / ./scripts/dev-down.sh.
# The image is pinned by the multi-arch index digest of docker.io/library/postgres:18 (PostgreSQL 18.6), resolved 2026-09-25
# (evidence/T-M1.4/digest.txt). Bound to loopback only. Credentials come from the git-ignored .env (copy .env.example).
name: englms-dev

services:
  db:
    image: docker.io/library/postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: englms-dev-db
    environment:
      POSTGRES_DB: ${ENGLMS_DEV_DB_NAME:-englms}
      POSTGRES_USER: ${ENGLMS_DEV_DB_USER:-englms}
      POSTGRES_PASSWORD: ${ENGLMS_DEV_DB_PASSWORD:?set ENGLMS_DEV_DB_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${ENGLMS_DEV_DB_PORT:-5432}:5432"
    volumes:
      - englms-dev-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  englms-dev-pgdata:
    name: englms-dev-pgdata
