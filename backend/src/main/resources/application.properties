spring.application.name=englms

# Workspace metadata served by GET /api/v1/meta (settings module).
englms.meta.name=englms
englms.meta.version=@project.version@
englms.meta.display-name=Eng-LMS
englms.meta.locales=vi,en

# Runtime
spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app

# Database: one schema, "app" (data-model.md). Credentials come from the environment (deployment.md).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/englms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:englms}
spring.datasource.hikari.schema=app
spring.flyway.schemas=app
spring.flyway.default-schema=app
spring.modulith.events.jdbc.schema=app

# Structured JSON logs on the console (Boot native structured logging); MDC "requestId" is included.
logging.structured.format.console=ecs

# Actuator: management port only, health + info only, with liveness/readiness groups.
management.server.port=8081
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=false

# OpenAPI contract (ADR-0014): deterministic output, no UI. Not served at runtime; OpenApiContractTest enables it.
springdoc.api-docs.enabled=false
springdoc.api-docs.path=/v3/api-docs
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
springdoc.paths-to-match=/api/**

# Identity (T-M2.1, ADR-0005, security.md §3). Sessions live in PostgreSQL (Spring Session JDBC; tables from Flyway).
# The idle timeout (A-021, OQ-10 default) is configurable via SERVER_SERVLET_SESSION_TIMEOUT.
server.servlet.session.timeout=12h
server.servlet.session.cookie.name=ENGLMS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# NFR-SEC-04: Secure cookies. false is refused at startup unless the "local" Spring profile is active.
server.servlet.session.cookie.secure=true
spring.session.jdbc.initialize-schema=never
# Lockout (NFR-SEC-05), per-IP sign-in throttle (instance-local) and remember-me validity (A-021).
englms.security.lockout.max-failures=10
englms.security.lockout.duration=15m
englms.security.login-throttle.max-attempts=30
englms.security.login-throttle.window=5m
englms.security.remember-me.validity=30d
# Tutor bootstrap (FR-AUTH-02): read once, while no tutor exists. The password comes from a file, never a value.
englms.bootstrap.tutor.username=${ENGLMS_BOOTSTRAP_TUTOR_USERNAME:}
englms.bootstrap.tutor.password-file=${ENGLMS_BOOTSTRAP_TUTOR_PASSWORD_FILE:}
# The operator CLI (--englms.cli=<command>, runbooks §4) runs no scheduled job (T-M2.1 AC11). Spring Modulith's
# "moments" scheduler (hourly/midnight events) is on only when englms.cli is unset: with a command set, the value is
# the command name, which is not "true", so the auto-configuration stays off.
spring.modulith.moments.enabled=${englms.cli:true}
# T-M2.9 (DEC-100 S4-2): Hibernate 7's SqlExceptionHelper logs (logger org.hibernate.orm.jdbc.error) the PostgreSQL
# message of every refused statement before the application sees the exception. For a duplicate username that message
# carries the username ("Key (username_normalized)=(...) already exists"), personal data (data-model.md §3). Off: a
# violation the application translates (409 USERNAME_TAKEN) is not an error, and an unexpected SQL error still reaches
# ProblemDetailsAdvice, which logs it with its cause ("Unhandled exception", 500).
logging.level.org.hibernate.orm.jdbc.error=off
