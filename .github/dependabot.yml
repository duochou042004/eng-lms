version: 2
updates:
  # npm (web/, e2e/) entries are added by T-M1.3 / T-M1.6.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
    commit-message:
      prefix: "build"
