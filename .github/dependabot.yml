version: 2
updates:
  # The npm entry for e2e/ is added by T-M1.6.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
    commit-message:
      prefix: "build"
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-aria-components", "react-router"]
      tooling:
        patterns: ["vite", "vitest", "@vitejs/*", "typescript", "oxlint", "stylelint*", "prettier"]
    commit-message:
      prefix: "build"
    ignore:
      # @types/node tracks the Node runtime major (24: engines, CI, image); majors move with the runtime (DEC-056).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) drops the JS compiler API that openapi-typescript 7.x needs (PR #6, DEC-056).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
