version: 2
updates:
  # The npm entry for e2e/ is added by T-M1.6.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
    commit-message:
      prefix: "build"
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-aria-components", "react-router"]
      tooling:
        patterns: ["vite", "vitest", "@vitejs/*", "typescript", "oxlint", "stylelint*", "prettier"]
    commit-message:
      prefix: "build"
