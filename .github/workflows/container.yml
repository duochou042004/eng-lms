name: container

# CI scope (T-M2.23, ci-cd.md §1.2): the job always runs and reports; scripts/ci-scope.sh decides whether its heavy steps run
# (shadow mode until T-M2.26: they always run). scripts/tests/ci-scope-workflows.test.sh pins this wiring.
# Build-only check of deploy/Containerfile on every PR (T-M1.5). Nothing is pushed: registry publishing, Trivy and
# releases are M8 (ci-cd.md). Not a required check; the same command as locally (development-setup §4).
on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read
  actions: read # ci-scope.sh reads run and job conclusions on pushes to develop (T-M2.23)

concurrency:
  group: container-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  container-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and both parents, for ci-scope.sh
          persist-credentials: false
      # CI scope (T-M2.23, ci-cd.md §1): decides `full` or `fast-path` for this run and fails closed. Never give it an `if:` or
      # `continue-on-error`: the steps below run unless its `scope` output is exactly `fast-path` (only possible in enforce mode).
      - name: CI scope
        id: scope
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SCOPE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_SCOPE_BEFORE: ${{ github.event.before }}
          CI_SCOPE_KIND: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
        run: ./scripts/ci-scope.sh "$CI_SCOPE_KIND"
      - name: Build the image (rootless Podman, no push)
        if: steps.scope.outputs.scope != 'fast-path'
        run: |
          podman --version
          podman build --format docker -f deploy/Containerfile -t localhost/englms:ci .
      - name: Runtime image facts (non-root, JRE only, healthcheck)
        if: steps.scope.outputs.scope != 'fast-path'
        run: |
          podman image inspect localhost/englms:ci --format 'user={{.Config.User}} size={{.Size}} healthcheck={{.Config.Healthcheck.Test}}'
          test "$(podman image inspect localhost/englms:ci --format '{{.Config.User}}')" = "10001:10001"
          podman run --rm --entrypoint bash localhost/englms:ci -c '! command -v javac && ! command -v node && id -u | grep -qx 10001'
      # The marker (T-M2.23): `success` means the classifier asked for a full run and every step above passed; `skipped` means a
      # fast-path verdict (or a failed step). merge-gate.sh and ci-scope.sh read this step's name and conclusion. Keep it last.
      - name: Full run on ${{ github.base_ref || github.ref_name }}
        if: steps.scope.outputs.verdict != 'fast-path'
        run: echo "full run completed"
