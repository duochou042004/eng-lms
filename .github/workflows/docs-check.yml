name: docs-check

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install docs-check dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Docs gate (schema, links, ID references, source integrity, handoff prompt, records)
        env:
          # The handoff-archive check diffs against the PR's base; pushes (base_ref empty) keep the default, origin/develop.
          ENGLMS_DOCS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: ./scripts/check-docs.sh
      - name: Governance script tests (merge gate, path ownership, pre-push hook)
        run: ./scripts/tests/run-all.sh
      - name: Path ownership (agent-roles.md §3)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/check-path-ownership.sh "$HEAD_REF" "origin/$BASE_REF"
