name: secrets-scan

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # MIT-licensed gitleaks CLI, pinned by version + SHA-256 (tech-stack.md §4). Not the EULA-licensed gitleaks-action.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (verified checksum)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan full git history
        run: /tmp/gitleaks git --redact --verbose --exit-code 1 .
