name: contract-drift

# CI scope (T-M2.23, ci-cd.md §1.2): the job always runs and reports; scripts/ci-scope.sh decides whether its heavy steps run
# (shadow mode until T-M2.26: they always run). scripts/tests/ci-scope-workflows.test.sh pins this wiring.
# Runs on every PR (no paths: filter): `contract-drift` is a required check (scripts/required-checks.txt). It regenerates
# api/openapi.json and the web types from the code and fails on any difference (ADR-0014, T-M1.5).
on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read
  actions: read # ci-scope.sh reads run and job conclusions on pushes to develop (T-M2.23)

concurrency:
  group: contract-drift-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  contract-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the merge commit and both parents, for ci-scope.sh
          persist-credentials: false
      # CI scope (T-M2.23, ci-cd.md §1): decides `full` or `fast-path` for this run and fails closed. Never give it an `if:` or
      # `continue-on-error`: the steps below run unless its `scope` output is exactly `fast-path` (only possible in enforce mode).
      - name: CI scope
        id: scope
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SCOPE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_SCOPE_BEFORE: ${{ github.event.before }}
          CI_SCOPE_KIND: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
        run: ./scripts/ci-scope.sh "$CI_SCOPE_KIND"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.scope.outputs.scope != 'fast-path'
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.scope != 'fast-path'
        with:
          node-version: "24"
      - name: Enable pnpm
        if: steps.scope.outputs.scope != 'fast-path'
        run: corepack enable
      - name: Install web dependencies (frozen lockfile)
        if: steps.scope.outputs.scope != 'fast-path'
        working-directory: web
        run: pnpm install --frozen-lockfile
      # OpenApiContractTest with -Dcontract.write=true (Testcontainers PostgreSQL 18), then pnpm api:generate, then a diff.
      - name: Regenerate the contract and the web types, then diff
        if: steps.scope.outputs.scope != 'fast-path'
        run: ./scripts/contract-drift.sh
      - name: No other tracked file changed
        if: steps.scope.outputs.scope != 'fast-path'
        run: git diff --exit-code
      # The marker (T-M2.23): `success` means the classifier asked for a full run and every step above passed; `skipped` means a
      # fast-path verdict (or a failed step). merge-gate.sh and ci-scope.sh read this step's name and conclusion. Keep it last.
      - name: Full run on ${{ github.base_ref || github.ref_name }}
        if: steps.scope.outputs.verdict != 'fast-path'
        run: echo "full run completed"
