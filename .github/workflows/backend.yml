name: backend

# Runs on every PR (no paths: filter): `backend` is a required check (scripts/required-checks.txt), and a path-filtered
# required check would never report on docs or web PRs, so merge-gate would refuse them (T-M1.2, docs review F7).
on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Unit, architecture, modularity, forbidden-identifier, Flyway (Testcontainers PostgreSQL 18) and contract tests.
      - name: Verify
        run: ./mvnw -B -ntp verify
      # JaCoCo report from `verify` (T-M1.5, OQ-16). No coverage threshold yet: the floors start with the first domain module.
      # The totals go to the job summary (no artifact storage needed); the HTML report is also uploaded as an artifact.
      # Report uploads are diagnostics: an account-wide artifact storage quota must not fail this required check (DEC-053).
      - name: Coverage summary
        if: always()
        working-directory: .
        run: ./scripts/coverage-summary.sh >> "$GITHUB_STEP_SUMMARY" && ./scripts/coverage-summary.sh
      - name: Upload coverage report
        id: upload-coverage
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          retention-days: 5
          if-no-files-found: warn
      # A failed best-effort upload stays non-blocking but becomes visible as an annotation (T-M1.8 AC6, DEC-055 R2-1).
      - name: Warn when the coverage upload failed
        if: always() && steps.upload-coverage.outcome == 'failure'
        run: echo "::warning title=Coverage report not uploaded::The backend-coverage artifact upload failed (storage quota?); the totals are still in the job summary."
      - name: Upload test reports
        id: upload-test-reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 5
      - name: Warn when the test-report upload failed
        if: always() && steps.upload-test-reports.outcome == 'failure'
        run: echo "::warning title=Test reports not uploaded::The backend-test-reports artifact upload failed (storage quota?); see the GitLab mirror pipeline (DEC-060; paused, DEC-107: re-run the job)."
