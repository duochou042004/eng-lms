name: web

# Runs on every PR (no paths: filter): `web` is a required check (scripts/required-checks.txt), and a path-filtered
# required check would never report on backend or docs PRs, so merge-gate would refuse them (as for backend, T-M1.2).
on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # pnpm version comes from package.json "packageManager" (corepack).
      - name: Enable pnpm
        run: corepack enable
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint (oxlint, stylelint, prettier)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: API types match api/openapi.json
        run: pnpm api:generate && git diff --exit-code -- src/lib/api/schema.d.ts
      - name: Test (unit, component, axe, i18n completeness)
        run: pnpm test --run
      - name: Build
        run: pnpm build
      - name: Bundle budget
        run: pnpm budget
      - name: Contrast check
        run: pnpm contrast
